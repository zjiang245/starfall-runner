<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>星尘穿梭</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #aeb8c8;
      --panel: rgba(12, 18, 28, 0.74);
      --line: rgba(255, 255, 255, 0.18);
      --good: #70e1c8;
      --warn: #ffd166;
      --bad: #ff6b6b;
      --sky: #111827;
      --deep: #08111f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08111f;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background:
        radial-gradient(circle at 25% 20%, rgba(69, 123, 157, 0.26), transparent 28%),
        radial-gradient(circle at 76% 78%, rgba(112, 225, 200, 0.16), transparent 28%),
        linear-gradient(180deg, var(--sky), var(--deep));
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 10px auto auto 10px;
      display: grid;
      grid-template-columns: repeat(3, 58px) 92px auto;
      align-items: start;
      gap: 6px;
      pointer-events: none;
    }

    .meter,
    .action {
      min-height: 34px;
      padding: 5px 7px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-radius: 8px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
    }

    .meter strong {
      display: block;
      font-size: 14px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .meter span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
    }

    .shieldbar {
      width: 92px;
      min-width: 92px;
    }

    .bar {
      height: 6px;
      margin-top: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
    }

    .fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--good), var(--warn), var(--bad));
      transition: width 120ms linear;
    }

    .actions {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .hud > div:nth-child(5) {
      display: none;
    }

    button {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12, 18, 28, 0.78);
      color: var(--ink);
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
    }

    button:hover {
      border-color: rgba(255, 255, 255, 0.38);
      background: rgba(21, 31, 46, 0.82);
    }

    button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, rgba(8, 17, 31, 0.12), rgba(8, 17, 31, 0.58));
      pointer-events: auto;
    }

    .panel {
      width: min(460px, calc(100vw - 34px));
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12, 18, 28, 0.82);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.44);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .panel p {
      margin: 14px 0 0;
      color: #d4deeb;
      line-height: 1.65;
      font-size: 15px;
    }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .chip {
      min-height: 42px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #dce8f5;
      font-size: 13px;
    }

    .chip b {
      color: var(--ink);
      font-weight: 700;
    }

    .primary {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      font-weight: 800;
      color: #07101e;
      background: linear-gradient(90deg, #70e1c8, #ffd166);
      border: 0;
      box-shadow: 0 14px 36px rgba(112, 225, 200, 0.2);
    }

    .primary:hover {
      background: linear-gradient(90deg, #8bf2dc, #ffe08a);
    }

    .hidden {
      display: none;
    }

    .touchpad {
      position: absolute;
      inset: auto 18px 18px;
      display: none;
      grid-template-columns: repeat(2, 64px);
      justify-content: space-between;
      pointer-events: none;
    }

    .touchpad button {
      width: 64px;
      height: 64px;
      pointer-events: auto;
      background: rgba(12, 18, 28, 0.46);
    }

    @media (max-width: 760px) {
      .game {
        min-height: 100svh;
      }

      .hud {
        inset: 8px auto auto 8px;
        grid-template-columns: repeat(3, 48px) 80px;
        gap: 5px;
      }

      .hud .shieldbar {
        grid-column: 4;
        width: 80px;
        min-width: 80px;
      }

      .meter,
      button {
        min-height: 30px;
      }

      .meter strong {
        font-size: 12px;
      }

      .actions {
        grid-column: 1 / 5;
        grid-row: 2;
        flex-direction: column;
        width: 34px;
      }

      .touchpad {
        display: grid;
      }

      .legend {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="星尘穿梭小游戏">
    <canvas id="world"></canvas>

    <section class="hud" aria-live="polite">
      <div class="meter"><strong id="score">0</strong><span>分数</span></div>
      <div class="meter"><strong id="combo">x1</strong><span>连击</span></div>
      <div class="meter"><strong id="best">0</strong><span>最佳</span></div>
      <div class="meter shieldbar"><strong id="shieldText">100%</strong><span>生命</span><div class="bar"><div id="shieldFill" class="fill"></div></div></div>
      <div></div>
      <div class="actions">
        <button id="pauseBtn" type="button" title="暂停">
          <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
        </button>
        <button id="restartBtn" type="button" title="重新开始">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
        </button>
      </div>
    </section>

    <section id="overlay" class="overlay">
      <div class="panel">
        <h1 id="title">星尘穿梭</h1>
        <p id="message">20 万分后子弹威力翻倍，击败 120 万分最终 Boss 即可通关。</p>
        <div class="legend">
          <div class="chip"><b>鼠标 / 方向键</b><br>移动飞船</div>
          <div class="chip"><b>空格 / P</b><br>暂停或继续</div>
          <div class="chip"><b>红 / 蓝 / 绿宝石</b><br>强化、回复、防护</div>
          <div class="chip"><b>黑色大陨石</b><br>巨大且危险</div>
        </div>
        <button id="startBtn" class="primary" type="button">开始穿梭</button>
      </div>
    </section>

    <section class="touchpad" aria-hidden="true">
      <button id="leftBtn" type="button" title="向左">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="rightBtn" type="button" title="向右">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");
    const bestEl = document.getElementById("best");
    const shieldText = document.getElementById("shieldText");
    const shieldFill = document.getElementById("shieldFill");
    const overlay = document.getElementById("overlay");
    const titleEl = document.getElementById("title");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    const storeKey = "starfall-runner-best";
    const bossScores = [10000, 50000, 100000, 200000, 400000, 800000, 1200000];
    const state = {
      width: 0,
      height: 0,
      dpr: 1,
      running: false,
      paused: false,
      gameOver: false,
      score: 0,
      combo: 1,
      streak: 0,
      shield: 100,
      best: Number(localStorage.getItem(storeKey) || 0),
      time: 0,
      spawn: 0,
      rubySpawn: 10,
      sapphireSpawn: 10,
      emeraldSpawn: 10,
      rubyPower: 0,
      emeraldGuard: 0,
      fireCooldown: 0,
      greenCooldown: 0,
      missileCooldown: 0,
      lanes: 1,
      greenLanes: 0,
      missileCount: 0,
      bossIndex: 0,
      boss: null,
      bossProjectiles: [],
      shake: 0,
      player: { x: 0, y: 0, radius: 18, vx: 0 },
      pointerX: null,
      bullets: [],
      missiles: [],
      stars: [],
      rocks: [],
      gems: [],
      particles: [],
      backdrop: [],
      keys: new Set()
    };

    function resize() {
      state.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = state.width + "px";
      canvas.style.height = state.height + "px";
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      state.player.y = state.height - Math.max(96, state.height * 0.16);
      state.player.x = state.player.x || state.width / 2;
      state.player.x = clamp(state.player.x, 30, state.width - 30);
      makeBackdrop();
    }

    function makeBackdrop() {
      const count = Math.floor((state.width * state.height) / 11500);
      state.backdrop = Array.from({ length: count }, () => ({
        x: Math.random() * state.width,
        y: Math.random() * state.height,
        r: Math.random() * 1.8 + 0.4,
        speed: Math.random() * 28 + 12,
        glow: Math.random() * 0.7 + 0.25
      }));
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function reset() {
      state.running = true;
      state.paused = false;
      state.gameOver = false;
      state.score = 0;
      state.combo = 1;
      state.streak = 0;
      state.shield = 100;
      state.time = 0;
      state.spawn = 0;
      state.rubySpawn = 10;
      state.sapphireSpawn = 10;
      state.emeraldSpawn = 10;
      state.rubyPower = 0;
      state.emeraldGuard = 0;
      state.fireCooldown = 0;
      state.greenCooldown = 0;
      state.missileCooldown = 0;
      state.lanes = 1;
      state.greenLanes = 0;
      state.missileCount = 0;
      state.bossIndex = 0;
      state.boss = null;
      state.bossProjectiles = [];
      state.shake = 0;
      state.bullets = [];
      state.missiles = [];
      state.stars = [];
      state.rocks = [];
      state.gems = [];
      state.particles = [];
      state.player.x = state.width / 2;
      state.player.vx = 0;
      overlay.classList.add("hidden");
      updateHud();
    }

    function pauseToggle() {
      if (!state.running || state.gameOver) return;
      state.paused = !state.paused;
      if (state.paused) {
        showOverlay("已暂停", "稍微喘口气。继续后星尘雨会接着落下。", "继续穿梭");
      } else {
        overlay.classList.add("hidden");
      }
    }

    function showOverlay(title, message, button) {
      titleEl.textContent = title;
      messageEl.textContent = message;
      startBtn.textContent = button;
      overlay.classList.remove("hidden");
    }

    function endGame() {
      state.running = false;
      state.gameOver = true;
      state.best = Math.max(state.best, Math.floor(state.score));
      localStorage.setItem(storeKey, String(state.best));
      updateHud();
      showOverlay("航线结束", `最终得分 ${Math.floor(state.score)}，最高连击倍率 x${state.combo}。`, "再来一局");
    }

    function completeGame() {
      state.running = false;
      state.gameOver = true;
      state.best = Math.max(state.best, Math.floor(state.score));
      localStorage.setItem(storeKey, String(state.best));
      updateHud();
      showOverlay("恭喜通关", `你击败了 1200000 分最终 Boss，最终得分 ${Math.floor(state.score)}。`, "重新开始");
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(state.score);
      comboEl.textContent = "x" + state.combo;
      bestEl.textContent = state.best;
      shieldText.textContent = Math.ceil(state.shield) + "%";
      shieldFill.style.width = clamp(state.shield, 0, 100) + "%";
    }

    function difficulty() {
      return Math.min(3.4, 1 + state.time / 42);
    }

    function bulletLaneCount() {
      return clamp(1 + Math.floor(state.score / 1000), 1, 5);
    }

    function greenLaneCount() {
      if (state.score < 500000) return 0;
      return clamp(1 + Math.floor((state.score - 500000) / 30000), 1, 6);
    }

    function scorePowerMultiplier() {
      return state.score >= 200000 ? 2 : 1;
    }

    function missileUnlockCount() {
      const firstMissileScore = 1000 * 4 + 500;
      if (state.score < firstMissileScore) return 0;
      return clamp(1 + Math.floor((state.score - firstMissileScore) / 1000), 1, 5);
    }

    function unlockBulletLanes() {
      const unlockedLanes = bulletLaneCount();
      if (unlockedLanes <= state.lanes) return false;
      state.lanes = unlockedLanes;
      state.fireCooldown = 0;
      burst(state.player.x, state.player.y - 34, "#70e1c8", 18);
      return true;
    }

    function unlockGreenLanes() {
      const unlockedLanes = greenLaneCount();
      if (unlockedLanes <= state.greenLanes) return false;
      state.greenLanes = unlockedLanes;
      state.greenCooldown = 0;
      burst(state.player.x, state.player.y - 38, "#7CFF6B", 26);
      return true;
    }

    function unlockMissiles() {
      const unlockedMissiles = missileUnlockCount();
      if (unlockedMissiles <= state.missileCount) return false;
      state.missileCount = unlockedMissiles;
      state.missileCooldown = 0;
      burst(state.player.x, state.player.y - 40, "#7dd3fc", 22);
      return true;
    }

    function spawnBoss() {
      const scoreMark = bossScores[state.bossIndex];
      const bossHp = 100 * Math.pow(2, state.bossIndex);
      const kind = [200000, 400000, 800000].includes(scoreMark) ? "bull" : scoreMark === 1200000 ? "demon" : "tom";
      const radius = kind === "demon" ? 75 : 50;
      state.boss = {
        x: state.width / 2,
        baseX: state.width / 2,
        y: Math.max(kind === "demon" ? 126 : 108, state.height * 0.14),
        r: radius,
        radius,
        kind,
        hp: bossHp,
        maxHp: bossHp,
        scoreMark,
        fireTimer: kind === "tom" ? 3 : 5,
        flame: null,
        laser: null,
        movePhase: Math.random() * Math.PI * 2,
        hitFlash: 0
      };
      state.bossIndex += 1;
      state.bossProjectiles = [];
      state.shake = Math.max(state.shake, 7);
      burst(state.boss.x, state.boss.y, "#7dd3fc", 46);
    }

    function damageBoss(amount) {
      if (!state.boss) return;
      state.boss.hp -= amount;
      state.boss.hitFlash = 0.16;
      if (state.boss.hp <= 0) {
        const x = state.boss.x;
        const y = state.boss.y;
        const scoreMark = state.boss.scoreMark;
        state.boss = null;
        state.bossProjectiles = [];
        state.score += 1000 * state.combo;
        state.shake = Math.max(state.shake, 12);
        burst(x, y, "#7dd3fc", 54);
        burst(x, y, "#ff9f6e", 60);
        if (scoreMark === 1200000) completeGame();
      }
    }

    function updateBoss(dt) {
      if (!state.boss && state.bossIndex < bossScores.length && state.score >= bossScores[state.bossIndex]) spawnBoss();
      const boss = state.boss;
      if (!boss) return;

      boss.baseX = state.width / 2;
      boss.y = Math.max(boss.kind === "demon" ? 126 : 108, state.height * 0.14);
      boss.x = boss.kind === "bull"
        ? clamp(boss.baseX + Math.sin(state.time * 0.72 + boss.movePhase) * state.width * 0.22, boss.r + 20, state.width - boss.r - 20)
        : state.width / 2;
      boss.hitFlash = Math.max(0, boss.hitFlash - dt);
      boss.fireTimer -= dt;

      if (boss.kind === "bull") {
        if (boss.fireTimer <= 0) {
          spawnBullRing(boss);
          boss.fireTimer = 5;
        }
        return;
      }

      if (boss.kind === "demon") {
        updateDemonLaser(boss, dt);
        return;
      }

      if (!boss.flame && boss.fireTimer <= 0) {
        const width = state.width / 3;
        boss.flame = {
          x: clamp(state.player.x, width / 2, state.width - width / 2),
          width,
          warmup: 0.55,
          active: 0.9,
          hit: false
        };
        boss.fireTimer = 3;
      }

      if (!boss.flame) return;
      if (boss.flame.warmup > 0) {
        boss.flame.warmup -= dt;
        return;
      }

      boss.flame.active -= dt;
      const half = boss.flame.width / 2;
      const inFire = Math.abs(state.player.x - boss.flame.x) <= half && state.player.y > boss.y;
      if (inFire && !boss.flame.hit) {
        state.shield -= state.emeraldGuard > 0 ? 25 : 50;
        state.streak = 0;
        state.combo = 1;
        state.shake = Math.max(state.shake, 12);
        boss.flame.hit = true;
        burst(state.player.x, state.player.y, "#ff6b6b", 28);
      }
      if (boss.flame.active <= 0) boss.flame = null;
    }

    function spawnBullRing(boss) {
      const speed = 150;
      for (let i = 0; i < 8; i++) {
        const angle = -Math.PI / 2 + i * Math.PI * 2 / 8;
        state.bossProjectiles.push({
          type: "bullHead",
          x: boss.x + Math.cos(angle) * 18,
          y: boss.y + boss.r * 0.7 + Math.sin(angle) * 18,
          r: 17,
          radius: 17,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed + 170,
          rot: angle,
          spin: 4.5,
          hit: false
        });
      }
      burst(boss.x, boss.y + boss.r, "#b7794a", 24);
    }

    function updateDemonLaser(boss, dt) {
      if (!boss.laser && boss.fireTimer <= 0) {
        const leftSide = Math.random() < 0.5;
        boss.laser = {
          x: leftSide ? 0 : state.width / 2,
          width: state.width / 2,
          warmup: 0.7,
          active: 0.9,
          hit: false
        };
        boss.fireTimer = 5;
      }

      if (!boss.laser) return;
      if (boss.laser.warmup > 0) {
        boss.laser.warmup -= dt;
        return;
      }

      boss.laser.active -= dt;
      const inLaser = state.player.x >= boss.laser.x && state.player.x <= boss.laser.x + boss.laser.width && state.player.y > boss.y;
      if (inLaser && !boss.laser.hit) {
        state.shield -= state.emeraldGuard > 0 ? 35 : 70;
        state.streak = 0;
        state.combo = 1;
        state.shake = Math.max(state.shake, 14);
        boss.laser.hit = true;
        burst(state.player.x, state.player.y, "#d946ef", 34);
      }
      if (boss.laser.active <= 0) boss.laser = null;
    }

    function spawnObject() {
      const level = difficulty();
      const rockChance = clamp(0.42 + state.time / 180, 0.42, 0.72);
      const isStar = Math.random() > rockChance;
      const isBigRock = !isStar && Math.random() < 0.1 + Math.min(0.12, state.time / 500);
      const size = isStar ? 12 + Math.random() * 7 : isBigRock ? 96 + Math.random() * 28 : 18 + Math.random() * 18;
      const item = {
        x: 26 + Math.random() * (state.width - 52),
        y: isBigRock ? -120 : -40,
        r: size,
        radius: size,
        type: isBigRock ? "bigRock" : isStar ? "star" : "rock",
        rot: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 4,
        hp: isStar ? 1 : isBigRock ? 30 : Math.max(1, Math.ceil(size / 20)),
        vy: (isStar ? 145 : 135) * level + Math.random() * (80 + level * 24),
        wobble: Math.random() * 8
      };
      if (isStar) state.stars.push(item);
      else state.rocks.push(item);
    }

    function spawnGem(type) {
      const color = type === "ruby" ? "#ff4d6d" : type === "sapphire" ? "#4dabff" : "#5cff8d";
      state.gems.push({
        type,
        color,
        x: 30 + Math.random() * (state.width - 60),
        y: -28,
        r: 15,
        radius: 15,
        vy: 155 + Math.random() * 60,
        rot: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 5
      });
    }

    function fireBullet() {
      const lanes = state.lanes;
      const spacing = 14;
      const center = (lanes - 1) / 2;
      const powerBoost = scorePowerMultiplier() * (state.rubyPower > 0 ? 2 : 1);
      for (let i = 0; i < lanes; i++) {
        const spread = i - center;
        state.bullets.push({
          x: state.player.x + spread * spacing,
          y: state.player.y - 25,
          r: 4,
          radius: 4,
          power: powerBoost,
          color: "#ffd166",
          vx: spread * 42,
          vy: -620,
          life: 1.1
        });
      }
      burst(state.player.x, state.player.y - 28, "#ffd166", 2 + lanes);
    }

    function fireGreenBullet() {
      const lanes = state.greenLanes;
      if (lanes <= 0) return;
      const spacing = 17;
      const center = (lanes - 1) / 2;
      const powerBoost = scorePowerMultiplier() * (state.rubyPower > 0 ? 2 : 1);
      for (let i = 0; i < lanes; i++) {
        const spread = i - center;
        state.bullets.push({
          x: state.player.x + spread * spacing,
          y: state.player.y - 31,
          r: 5,
          radius: 5,
          power: 2 * powerBoost,
          color: "#7CFF6B",
          vx: spread * 36,
          vy: -690,
          life: 1.18
        });
      }
      burst(state.player.x, state.player.y - 34, "#7CFF6B", 4 + lanes);
    }

    function fireMissiles() {
      const count = state.missileCount;
      if (count <= 0) return;
      const spacing = 20;
      const center = (count - 1) / 2;
      for (let i = 0; i < count; i++) {
        const spread = i - center;
        state.missiles.push({
          x: state.player.x + spread * spacing,
          y: state.player.y - 26,
          r: 8,
          radius: 8,
          vx: spread * 34,
          vy: -360,
          life: 2.8,
          trail: []
        });
      }
      burst(state.player.x, state.player.y - 36, "#7dd3fc", 4 + count);
    }

    function nearestRock(missile) {
      let target = null;
      let best = Infinity;
      if (state.boss && state.boss.y < missile.y + 40) {
        const dx = state.boss.x - missile.x;
        const dy = state.boss.y - missile.y;
        best = dx * dx + dy * dy;
        target = state.boss;
      }
      for (const rock of state.rocks) {
        if (rock.y > missile.y + 24) continue;
        const dx = rock.x - missile.x;
        const dy = rock.y - missile.y;
        const distance = dx * dx + dy * dy;
        if (distance < best) {
          best = distance;
          target = rock;
        }
      }
      return target;
    }

    function burst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 45 + Math.random() * 190;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.5 + Math.random() * 0.38,
          max: 0.88,
          color,
          r: 1.5 + Math.random() * 3.5
        });
      }
    }

    function hit(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const rr = a.r + b.radius;
      return dx * dx + dy * dy < rr * rr;
    }

    function update(dt) {
      if (!state.running || state.paused) return;
      state.time += dt;
      state.score += dt * 5 * state.combo;
      state.spawn -= dt;
      state.rubySpawn -= dt;
      state.sapphireSpawn -= dt;
      state.emeraldSpawn -= dt;
      state.rubyPower = Math.max(0, state.rubyPower - dt);
      state.emeraldGuard = Math.max(0, state.emeraldGuard - dt);
      state.fireCooldown -= dt;
      state.greenCooldown -= dt;
      state.missileCooldown -= dt;
      state.shake = Math.max(0, state.shake - dt * 18);

      unlockBulletLanes();
      unlockGreenLanes();
      unlockMissiles();
      updateBoss(dt);

      const left = state.keys.has("ArrowLeft") || state.keys.has("a") || state.keys.has("A");
      const right = state.keys.has("ArrowRight") || state.keys.has("d") || state.keys.has("D");
      if (state.pointerX !== null) {
        const targetX = clamp(state.pointerX, 26, state.width - 26);
        const previousX = state.player.x;
        state.player.x += (targetX - state.player.x) * Math.min(1, dt * 14);
        state.player.vx = (state.player.x - previousX) / Math.max(dt, 0.001);
      } else {
        const input = (right ? 1 : 0) - (left ? 1 : 0);
        state.player.vx += input * 2300 * dt;
        state.player.vx *= Math.pow(0.0008, dt);
        state.player.x = clamp(state.player.x + state.player.vx * dt, 26, state.width - 26);
      }

      if (state.fireCooldown <= 0) {
        fireBullet();
        state.fireCooldown = clamp(0.28 - state.time * 0.0011, 0.13, 0.28);
      }

      if (state.greenLanes > 0 && state.greenCooldown <= 0) {
        fireGreenBullet();
        state.greenCooldown = clamp(0.38 - state.time * 0.0007, 0.18, 0.38);
      }

      if (state.missileCount > 0 && state.missileCooldown <= 0) {
        fireMissiles();
        state.missileCooldown = clamp(1.18 - state.time * 0.002, 0.72, 1.18);
      }

      if (state.spawn <= 0) {
        spawnObject();
        const interval = clamp(0.72 - state.time * 0.01, 0.16, 0.72);
        state.spawn = interval * (0.7 + Math.random() * 0.6);
      }

      if (state.rubySpawn <= 0) {
        spawnGem("ruby");
        state.rubySpawn = 10;
      }
      if (state.sapphireSpawn <= 0) {
        spawnGem("sapphire");
        state.sapphireSpawn = 10;
      }
      if (state.emeraldSpawn <= 0) {
        spawnGem("emerald");
        state.emeraldSpawn = 10;
      }

      for (const bullet of state.bullets) {
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;
      }

      for (const missile of state.missiles) {
        const target = nearestRock(missile);
        if (target) {
          const dx = target.x - missile.x;
          const dy = target.y - missile.y;
          const len = Math.max(1, Math.hypot(dx, dy));
          const desiredSpeed = 470;
          missile.vx += ((dx / len) * desiredSpeed - missile.vx) * Math.min(1, dt * 4.8);
          missile.vy += ((dy / len) * desiredSpeed - missile.vy) * Math.min(1, dt * 4.8);
        } else {
          missile.vy -= 140 * dt;
        }
        missile.x += missile.vx * dt;
        missile.y += missile.vy * dt;
        missile.life -= dt;
        missile.trail.push({ x: missile.x, y: missile.y, life: 0.28 });
        if (missile.trail.length > 9) missile.trail.shift();
        for (const point of missile.trail) point.life -= dt;
        missile.trail = missile.trail.filter((point) => point.life > 0);
      }

      for (const star of state.stars) {
        star.y += star.vy * dt;
        star.x += Math.sin(state.time * 4 + star.wobble) * 18 * dt;
        star.rot += star.spin * dt;
      }

      for (const rock of state.rocks) {
        rock.y += rock.vy * dt;
        rock.x += Math.sin(state.time * 2.2 + rock.wobble) * 12 * dt;
        rock.rot += rock.spin * dt;
      }

      for (const gem of state.gems) {
        gem.y += gem.vy * dt;
        gem.rot += gem.spin * dt;
      }

      for (const projectile of state.bossProjectiles) {
        projectile.x += projectile.vx * dt;
        projectile.y += projectile.vy * dt;
        projectile.rot += projectile.spin * dt;
      }

      for (let b = state.bullets.length - 1; b >= 0; b--) {
        const bullet = state.bullets[b];
        let used = bullet.life <= 0 || bullet.y < -20;
        if (!used && state.boss && hit(state.boss, bullet)) {
          used = true;
          state.score += 8 * bullet.power * state.combo;
          burst(bullet.x, bullet.y, bullet.color, 8 + bullet.power * 2);
          damageBoss(bullet.power);
        }
        for (let r = state.rocks.length - 1; r >= 0 && !used; r--) {
          const rock = state.rocks[r];
          if (hit(rock, bullet)) {
            rock.hp -= bullet.power;
            used = true;
            state.score += 18 * bullet.power * state.combo;
            burst(bullet.x, bullet.y, bullet.color, 8 + bullet.power * 2);
            if (rock.hp <= 0) {
              state.rocks.splice(r, 1);
              state.streak += 1;
              state.combo = clamp(1 + Math.floor(state.streak / 5), 1, 9);
              state.score += 90 * state.combo;
              burst(rock.x, rock.y, "#ff9f6e", 24);
            }
          }
        }
        if (used) state.bullets.splice(b, 1);
      }

      for (let m = state.missiles.length - 1; m >= 0; m--) {
        const missile = state.missiles[m];
        let used = missile.life <= 0 || missile.y < -60 || missile.x < -60 || missile.x > state.width + 60;
        if (!used && state.boss && hit(state.boss, missile)) {
          used = true;
          state.score += 80 * state.combo;
          state.shake = Math.max(state.shake, 5);
          burst(missile.x, missile.y, "#7dd3fc", 24);
          damageBoss(10);
        }
        for (let r = state.rocks.length - 1; r >= 0 && !used; r--) {
          const rock = state.rocks[r];
          if (hit(rock, missile)) {
            used = true;
            state.rocks.splice(r, 1);
            state.streak += 1;
            state.combo = clamp(1 + Math.floor(state.streak / 5), 1, 9);
            state.score += 150 * state.combo;
            state.shake = Math.max(state.shake, 4);
            burst(rock.x, rock.y, "#7dd3fc", 34);
            burst(rock.x, rock.y, "#ff9f6e", 18);
          }
        }
        if (used) state.missiles.splice(m, 1);
      }

      for (let i = state.stars.length - 1; i >= 0; i--) {
        const star = state.stars[i];
        if (hit(star, state.player)) {
          state.stars.splice(i, 1);
          state.streak += 1;
          state.combo = clamp(1 + Math.floor(state.streak / 5), 1, 9);
          state.score += 60 * state.combo;
          state.shield = clamp(state.shield + 3, 0, 100);
          burst(star.x, star.y, "#70e1c8", 14);
        } else if (star.y > state.height + 40) {
          state.stars.splice(i, 1);
          state.streak = Math.max(0, state.streak - 1);
          state.combo = clamp(1 + Math.floor(state.streak / 5), 1, 9);
        }
      }

      for (let i = state.gems.length - 1; i >= 0; i--) {
        const gem = state.gems[i];
        if (hit(gem, state.player)) {
          state.gems.splice(i, 1);
          if (gem.type === "ruby") {
            state.rubyPower = 5;
            burst(gem.x, gem.y, gem.color, 26);
          } else if (gem.type === "sapphire") {
            state.shield = clamp(state.shield + 20, 0, 100);
            burst(gem.x, gem.y, gem.color, 24);
          } else {
            state.emeraldGuard = 5;
            burst(gem.x, gem.y, gem.color, 28);
          }
        } else if (gem.y > state.height + 40) {
          state.gems.splice(i, 1);
        }
      }

      for (let i = state.bossProjectiles.length - 1; i >= 0; i--) {
        const projectile = state.bossProjectiles[i];
        if (hit(projectile, state.player)) {
          state.bossProjectiles.splice(i, 1);
          state.shield -= 40;
          state.streak = 0;
          state.combo = 1;
          state.shake = Math.max(state.shake, 7);
          burst(projectile.x, projectile.y, "#b7794a", 18);
        } else if (projectile.y > state.height + 60 || projectile.x < -80 || projectile.x > state.width + 80) {
          state.bossProjectiles.splice(i, 1);
        }
      }

      for (let i = state.rocks.length - 1; i >= 0; i--) {
        const rock = state.rocks[i];
        if (hit(rock, state.player)) {
          state.rocks.splice(i, 1);
          state.shield -= rock.type === "bigRock" ? 60 : 24;
          state.streak = 0;
          state.combo = 1;
          state.shake = 8;
          burst(rock.x, rock.y, "#ff6b6b", 20);
        } else if (rock.y > state.height + 54) {
          state.rocks.splice(i, 1);
        }
      }

      if (unlockBulletLanes()) {
        fireBullet();
        state.fireCooldown = clamp(0.28 - state.time * 0.0011, 0.13, 0.28);
      }

      if (unlockGreenLanes()) {
        fireGreenBullet();
        state.greenCooldown = clamp(0.38 - state.time * 0.0007, 0.18, 0.38);
      }

      if (unlockMissiles()) {
        fireMissiles();
        state.missileCooldown = clamp(1.18 - state.time * 0.002, 0.72, 1.18);
      }

      for (const p of state.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 120 * dt;
        p.life -= dt;
      }
      state.particles = state.particles.filter((p) => p.life > 0);

      for (const star of state.backdrop) {
        star.y += star.speed * dt;
        if (star.y > state.height + 5) {
          star.y = -5;
          star.x = Math.random() * state.width;
        }
      }

      if (state.emeraldGuard <= 0) state.shield -= dt * 1.4;
      if (state.shield <= 0) endGame();
      updateHud();
    }

    function drawShip(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(state.player.vx * 0.0006);
      ctx.shadowColor = "rgba(112, 225, 200, 0.7)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#eaf7ff";
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(18, 18);
      ctx.lineTo(0, 10);
      ctx.lineTo(-18, 18);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#70e1c8";
      ctx.beginPath();
      ctx.moveTo(0, -13);
      ctx.lineTo(7, 8);
      ctx.lineTo(-7, 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#ffd166";
      ctx.fillRect(-10, -8, 4, 20);
      ctx.fillRect(6, -8, 4, 20);
      ctx.fillStyle = "rgba(255, 209, 102, 0.92)";
      ctx.beginPath();
      ctx.moveTo(-7, 17);
      ctx.lineTo(0, 34 + Math.sin(state.time * 18) * 4);
      ctx.lineTo(7, 17);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBullet(bullet) {
      const color = bullet.color || "#ffd166";
      const width = bullet.power > 1 ? 8 : 6;
      const height = bullet.power > 1 ? 24 : 20;
      ctx.save();
      ctx.translate(bullet.x, bullet.y);
      ctx.shadowColor = color;
      ctx.shadowBlur = bullet.power > 1 ? 20 : 14;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-width / 2, -height + 7, width, height, 5);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 255, 255, 0.86)";
      ctx.beginPath();
      ctx.arc(0, -height + 8, bullet.power > 1 ? 3.2 : 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawMissile(missile) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const point of missile.trail) {
        ctx.globalAlpha = clamp(point.life / 0.28, 0, 1) * 0.7;
        ctx.fillStyle = "#7dd3fc";
        ctx.beginPath();
        ctx.arc(point.x, point.y, 7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      const angle = Math.atan2(missile.vy, missile.vx) + Math.PI / 2;
      ctx.save();
      ctx.translate(missile.x, missile.y);
      ctx.rotate(angle);
      ctx.shadowColor = "rgba(125, 211, 252, 0.9)";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#dff8ff";
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(8, 9);
      ctx.lineTo(0, 5);
      ctx.lineTo(-8, 9);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#7dd3fc";
      ctx.fillRect(-3, -5, 6, 12);
      ctx.fillStyle = "#ff8a75";
      ctx.beginPath();
      ctx.moveTo(-5, 10);
      ctx.lineTo(0, 18);
      ctx.lineTo(5, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawStar(item) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rot);
      ctx.shadowColor = "rgba(112, 225, 200, 0.9)";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#70e1c8";
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? item.r : item.r * 0.43;
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawRock(item) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rot);
      const big = item.type === "bigRock";
      ctx.shadowColor = big ? "rgba(0, 0, 0, 0.88)" : "rgba(255, 107, 107, 0.55)";
      ctx.shadowBlur = big ? 26 : 12;
      ctx.fillStyle = big ? "#05070c" : "#773440";
      ctx.strokeStyle = big ? "#353946" : "#ff8a75";
      ctx.lineWidth = big ? 4 : 2;
      ctx.beginPath();
      const points = big ? 14 : 9;
      for (let i = 0; i < points; i++) {
        const angle = i * Math.PI * 2 / points;
        const radius = item.r * (big ? 0.78 + ((i * 29) % 23) / 100 : 0.74 + ((i * 37) % 21) / 100);
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = big ? "rgba(255, 255, 255, 0.08)" : "rgba(255, 209, 102, 0.4)";
      ctx.beginPath();
      ctx.arc(-item.r * 0.2, -item.r * 0.12, item.r * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawGem(gem) {
      ctx.save();
      ctx.translate(gem.x, gem.y);
      ctx.rotate(gem.rot);
      ctx.shadowColor = gem.color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = gem.color;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -gem.r);
      ctx.lineTo(gem.r * 0.9, 0);
      ctx.lineTo(0, gem.r);
      ctx.lineTo(-gem.r * 0.9, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
      ctx.beginPath();
      ctx.moveTo(0, -gem.r * 0.68);
      ctx.lineTo(gem.r * 0.34, 0);
      ctx.lineTo(0, gem.r * 0.35);
      ctx.lineTo(-gem.r * 0.34, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBossFlame(boss) {
      if (!boss || !boss.flame) return;
      const flame = boss.flame;
      const left = flame.x - flame.width / 2;
      const top = boss.y + boss.r * 0.7;
      const height = state.height - top;
      ctx.save();
      if (flame.warmup > 0) {
        ctx.globalAlpha = 0.24 + Math.sin(state.time * 26) * 0.08;
        ctx.fillStyle = "#ffd166";
        ctx.fillRect(left, top, flame.width, height);
        ctx.globalAlpha = 0.78;
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.strokeRect(left, top, flame.width, height);
      } else {
        const pulse = 0.78 + Math.sin(state.time * 32) * 0.12;
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = pulse;
        const gradient = ctx.createLinearGradient(0, top, 0, state.height);
        gradient.addColorStop(0, "rgba(255, 209, 102, 0.92)");
        gradient.addColorStop(0.34, "rgba(255, 107, 107, 0.7)");
        gradient.addColorStop(1, "rgba(255, 107, 107, 0.16)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(boss.x - 18, top);
        ctx.lineTo(left + flame.width, state.height);
        ctx.lineTo(left, state.height);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawDemonLaser(boss) {
      if (!boss || !boss.laser) return;
      const laser = boss.laser;
      const top = boss.y + boss.r * 0.35;
      const height = state.height - top;
      ctx.save();
      if (laser.warmup > 0) {
        ctx.globalAlpha = 0.22 + Math.sin(state.time * 28) * 0.08;
        ctx.fillStyle = "#d946ef";
        ctx.fillRect(laser.x, top, laser.width, height);
        ctx.globalAlpha = 0.82;
        ctx.strokeStyle = "#f0abfc";
        ctx.setLineDash([12, 10]);
        ctx.lineWidth = 3;
        ctx.strokeRect(laser.x, top, laser.width, height);
      } else {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.78 + Math.sin(state.time * 38) * 0.12;
        const gradient = ctx.createLinearGradient(0, top, 0, state.height);
        gradient.addColorStop(0, "rgba(255, 255, 255, 0.95)");
        gradient.addColorStop(0.22, "rgba(217, 70, 239, 0.72)");
        gradient.addColorStop(1, "rgba(88, 28, 135, 0.22)");
        ctx.fillStyle = gradient;
        ctx.fillRect(laser.x, top, laser.width, height);
      }
      ctx.restore();
    }

    function drawBullHead(x, y, size, rot, flash) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot || 0);
      ctx.shadowColor = flash ? "rgba(255, 255, 255, 0.9)" : "rgba(183, 121, 74, 0.65)";
      ctx.shadowBlur = flash ? 24 : 12;
      ctx.fillStyle = flash ? "#fff2d7" : "#8a5633";
      ctx.strokeStyle = "#f4d38b";
      ctx.lineWidth = Math.max(2, size * 0.05);
      ctx.beginPath();
      ctx.moveTo(-size * 0.78, -size * 0.36);
      ctx.quadraticCurveTo(-size * 1.28, -size * 0.66, -size * 1.46, -size * 1.05);
      ctx.quadraticCurveTo(-size * 0.78, -size * 0.88, -size * 0.48, -size * 0.38);
      ctx.moveTo(size * 0.78, -size * 0.36);
      ctx.quadraticCurveTo(size * 1.28, -size * 0.66, size * 1.46, -size * 1.05);
      ctx.quadraticCurveTo(size * 0.78, -size * 0.88, size * 0.48, -size * 0.38);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.88, size * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#f3c58c";
      ctx.beginPath();
      ctx.ellipse(0, size * 0.28, size * 0.48, size * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#101827";
      ctx.beginPath();
      ctx.arc(-size * 0.28, -size * 0.12, size * 0.08, 0, Math.PI * 2);
      ctx.arc(size * 0.28, -size * 0.12, size * 0.08, 0, Math.PI * 2);
      ctx.arc(-size * 0.14, size * 0.28, size * 0.06, 0, Math.PI * 2);
      ctx.arc(size * 0.14, size * 0.28, size * 0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawDemonBoss(boss) {
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.shadowColor = boss.hitFlash > 0 ? "rgba(255,255,255,0.9)" : "rgba(217,70,239,0.75)";
      ctx.shadowBlur = boss.hitFlash > 0 ? 30 : 24;
      ctx.fillStyle = boss.hitFlash > 0 ? "#fff1ff" : "#3b0a4f";
      ctx.strokeStyle = "#d946ef";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 4, boss.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.moveTo(-boss.r * 0.48, -boss.r * 0.35);
      ctx.lineTo(-boss.r * 0.86, -boss.r * 1.2);
      ctx.lineTo(-boss.r * 0.1, -boss.r * 0.66);
      ctx.closePath();
      ctx.moveTo(boss.r * 0.48, -boss.r * 0.35);
      ctx.lineTo(boss.r * 0.86, -boss.r * 1.2);
      ctx.lineTo(boss.r * 0.1, -boss.r * 0.66);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.ellipse(-boss.r * 0.25, -boss.r * 0.05, boss.r * 0.16, boss.r * 0.09, -0.25, 0, Math.PI * 2);
      ctx.ellipse(boss.r * 0.25, -boss.r * 0.05, boss.r * 0.16, boss.r * 0.09, 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(0, boss.r * 0.24, boss.r * 0.18, 0, Math.PI);
      ctx.fill();
      ctx.restore();
    }

    function drawBoss(boss) {
      if (!boss) return;
      if (boss.kind === "bull") {
        drawBullHead(boss.x, boss.y, boss.r, 0, boss.hitFlash > 0);
        drawBossHealth(boss);
        return;
      }
      if (boss.kind === "demon") {
        drawDemonBoss(boss);
        drawBossHealth(boss);
        return;
      }
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.shadowColor = boss.hitFlash > 0 ? "rgba(255, 255, 255, 0.9)" : "rgba(125, 211, 252, 0.65)";
      ctx.shadowBlur = boss.hitFlash > 0 ? 28 : 18;
      ctx.strokeStyle = "#dff8ff";
      ctx.lineWidth = 3;

      ctx.fillStyle = boss.hitFlash > 0 ? "#f4fbff" : "#6f8798";
      ctx.beginPath();
      ctx.arc(0, 4, boss.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = boss.hitFlash > 0 ? "#f4fbff" : "#607a8c";
      ctx.beginPath();
      ctx.moveTo(-34, -26);
      ctx.lineTo(-55, -68);
      ctx.lineTo(-8, -44);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(34, -26);
      ctx.lineTo(55, -68);
      ctx.lineTo(8, -44);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffd1d8";
      ctx.beginPath();
      ctx.moveTo(-35, -34);
      ctx.lineTo(-48, -58);
      ctx.lineTo(-18, -43);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(35, -34);
      ctx.lineTo(48, -58);
      ctx.lineTo(18, -43);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#f7fbff";
      ctx.beginPath();
      ctx.ellipse(-16, 15, 22, 25, -0.15, 0, Math.PI * 2);
      ctx.ellipse(16, 15, 22, 25, 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffe169";
      ctx.strokeStyle = "#132033";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(-17, -8, 12, 16, 0.08, 0, Math.PI * 2);
      ctx.ellipse(17, -8, 12, 16, -0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#101827";
      ctx.beginPath();
      ctx.ellipse(-15, -7, 4, 11, 0, 0, Math.PI * 2);
      ctx.ellipse(15, -7, 4, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff8fb3";
      ctx.beginPath();
      ctx.moveTo(0, 7);
      ctx.lineTo(10, 17);
      ctx.lineTo(0, 24);
      ctx.lineTo(-10, 17);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#142033";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 23);
      ctx.quadraticCurveTo(-8, 30, -20, 27);
      ctx.moveTo(0, 23);
      ctx.quadraticCurveTo(8, 30, 20, 27);
      ctx.moveTo(-10, 22);
      ctx.lineTo(-48, 15);
      ctx.moveTo(-10, 28);
      ctx.lineTo(-48, 31);
      ctx.moveTo(10, 22);
      ctx.lineTo(48, 15);
      ctx.moveTo(10, 28);
      ctx.lineTo(48, 31);
      ctx.stroke();

      ctx.fillStyle = "rgba(255, 107, 107, 0.9)";
      ctx.beginPath();
      ctx.ellipse(0, 42, 13, 6 + Math.sin(state.time * 8) * 1.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      drawBossHealth(boss);
    }

    function drawBossHealth(boss) {
      const barWidth = Math.min(320, state.width * 0.55);
      const barX = boss.x - barWidth / 2;
      const barY = Math.max(38, boss.y - boss.r - 24);
      ctx.save();
      ctx.fillStyle = "rgba(8, 17, 31, 0.72)";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barWidth, 10, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#ff6b6b";
      ctx.beginPath();
      ctx.roundRect(barX, barY, barWidth * clamp(boss.hp / boss.maxHp, 0, 1), 10, 6);
      ctx.fill();
      ctx.fillStyle = "#f7fbff";
      ctx.font = "10px Inter, sans-serif";
      ctx.textAlign = "center";
      const label = boss.kind === "bull" ? "BULL BOSS" : boss.kind === "demon" ? "DEMON BOSS" : "TOM BOSS";
      ctx.fillText(`${label} ${boss.scoreMark}`, boss.x, barY - 5);
      ctx.restore();
    }

    function drawBossProjectile(projectile) {
      if (projectile.type === "bullHead") drawBullHead(projectile.x, projectile.y, projectile.r, projectile.rot, false);
    }

    function render() {
      const wobbleX = state.shake ? (Math.random() - 0.5) * state.shake : 0;
      const wobbleY = state.shake ? (Math.random() - 0.5) * state.shake : 0;
      ctx.clearRect(0, 0, state.width, state.height);
      ctx.save();
      ctx.translate(wobbleX, wobbleY);

      ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
      for (const star of state.backdrop) {
        ctx.globalAlpha = star.glow;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawBossFlame(state.boss);
      drawDemonLaser(state.boss);
      for (const star of state.stars) drawStar(star);
      for (const rock of state.rocks) drawRock(rock);
      for (const gem of state.gems) drawGem(gem);
      drawBoss(state.boss);
      for (const projectile of state.bossProjectiles) drawBossProjectile(projectile);
      for (const bullet of state.bullets) drawBullet(bullet);
      for (const missile of state.missiles) drawMissile(missile);

      for (const p of state.particles) {
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawShip(state.player.x, state.player.y);
      ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", (event) => {
      state.pointerX = event.clientX;
    });
    window.addEventListener("pointerleave", () => {
      state.pointerX = null;
    });
    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", " ", "Spacebar"].includes(event.key)) event.preventDefault();
      if (event.key === " " || event.key === "Spacebar" || event.key === "p" || event.key === "P") {
        if (!state.running || state.gameOver) reset();
        else pauseToggle();
        return;
      }
      state.keys.add(event.key);
    });
    window.addEventListener("keyup", (event) => state.keys.delete(event.key));

    function bindTouch(button, key) {
      const down = (event) => {
        event.preventDefault();
        state.keys.add(key);
      };
      const up = (event) => {
        event.preventDefault();
        state.keys.delete(key);
      };
      button.addEventListener("pointerdown", down);
      button.addEventListener("pointerup", up);
      button.addEventListener("pointercancel", up);
      button.addEventListener("pointerleave", up);
    }

    bindTouch(leftBtn, "ArrowLeft");
    bindTouch(rightBtn, "ArrowRight");
    startBtn.addEventListener("click", () => {
      if (state.paused) {
        state.paused = false;
        overlay.classList.add("hidden");
      } else {
        reset();
      }
    });
    pauseBtn.addEventListener("click", pauseToggle);
    restartBtn.addEventListener("click", reset);

    resize();
    bestEl.textContent = state.best;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
